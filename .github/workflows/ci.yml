name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          gcc --version | head -n 1
          python3 --version
          make --version | head -n 1

      - name: Assembler tests
        run: make -C asm test

      - name: Emulator tests
        run: make -C emu test

      - name: Log recovery and analysis tests
        run: make -C emu test-tools

      - name: Emulator sanitizer tests
        run: make -C emu sanitize

      - name: RV32 Sv32 MMU unit tests
        run: make -C emu test-rv32

      - name: Install RV32 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: RV32 Sv32 guest test
        run: make -C emu test-rv32-guest
